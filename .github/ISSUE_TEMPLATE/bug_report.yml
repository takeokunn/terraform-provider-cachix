name: Bug Report
description: Report a problem with the Cachix Terraform provider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        sections below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal Terraform configuration and commands that reproduce the issue.
      placeholder: |
        resource "cachix_cache" "example" {
          name = "my-cache"
        }
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error output. Redact sensitive values such as tokens.
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform / OpenTofu version
      placeholder: "Terraform v1.9.0"
    validations:
      required: true
